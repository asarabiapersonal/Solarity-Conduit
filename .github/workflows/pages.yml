# Publishes the simulator to GitHub Pages on every push to main.
# node_modules/ isn't committed, so this installs Three.js
# and uploads only the files the browser needs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble the site
        run: |
          mkdir -p _site/node_modules/three/examples
          cp -r index.html styles.css js _site/
          cp -r node_modules/three/build _site/node_modules/three/
          cp -r node_modules/three/examples/jsm _site/node_modules/three/examples/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
